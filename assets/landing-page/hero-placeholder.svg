<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#f5f5f5"/>
  
  <!-- Geometric pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Central hexagon representing the platform -->
  <g transform="translate(960, 540)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="200" fill="#8B1538" opacity="0.1"/>
    
    <!-- Main hexagon -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" 
             fill="#8B1538" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Inner hexagon -->
    <polygon points="0,-100 87,-50 87,50 0,100 -87,50 -87,-50" 
             fill="#ffffff" opacity="0.9"/>
    
    <!-- Center icon -->
    <circle cx="0" cy="0" r="40" fill="#8B1538"/>
    <path d="M -20 0 L -10 10 L 20 -10" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Department nodes - Finance -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="60" fill="#8B1538" opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Finance</text>
  </g>
  
  <!-- Department nodes - HR -->
  <g transform="translate(1520, 300)">
    <circle cx="0" cy="0" r="60" fill="#8B1538" opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">HR</text>
  </g>
  
  <!-- Department nodes - Legal -->
  <g transform="translate(400, 780)">
    <circle cx="0" cy="0" r="60" fill="#8B1538" opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Legal</text>
  </g>
  
  <!-- Department nodes - Compliance -->
  <g transform="translate(1520, 780)">
    <circle cx="0" cy="0" r="60" fill="#8B1538" opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Compliance</text>
  </g>
  
  <!-- Connecting lines -->
  <line x1="480" y1="340" x2="830" y2="490" stroke="#8B1538" stroke-width="2" opacity="0.4"/>
  <line x1="1440" y1="340" x2="1090" y2="490" stroke="#8B1538" stroke-width="2" opacity="0.4"/>
  <line x1="480" y1="740" x2="830" y2="590" stroke="#8B1538" stroke-width="2" opacity="0.4"/>
  <line x1="1440" y1="740" x2="1090" y2="590" stroke="#8B1538" stroke-width="2" opacity="0.4"/>
  
  <!-- Bottom text -->
  <text x="960" y="950" text-anchor="middle" fill="#8B1538" font-family="Arial, sans-serif" font-size="32" font-weight="bold">
    Enterprise Operations &amp; Compliance Hub
  </text>
  
  <text x="960" y="990" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="16">
    Modern enterprise platform for business operations, compliance, and workflow automation
  </text>
</svg>
